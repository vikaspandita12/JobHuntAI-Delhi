name: Daily Job Scan — JobHuntAI Delhi

on:
  schedule:
    - cron: '30 2 * * *'  # 08:00 IST (UTC+5:30) every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Scan FreeHire · JSearch · HN · Adzuna · RemoteOK · LinkedIn · Naukri · and more
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/compare-cursor-repos-E1qVk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scan
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA:             ${{ secrets.ADZUNA }}
          JSEARCH_API_KEY:    ${{ secrets.JSEARCH_API_KEY }}
          JSEARCH_HOST:       rapidapi
          VIKAS_SMTP_USER:    vikaspandita111@gmail.com
          VIKAS_SMTP_PASS:    ${{ secrets.JOB }}
          DIKSHA_SMTP_USER:   dikshakoul88@gmail.com
          DIKSHA_SMTP_PASS:   ${{ secrets.DIKSHASECRET }}
          VIKAS_EMAIL:        vikaspandita1@gmail.com
          DIKSHA_EMAIL:       dikshakoul88@gmail.com
          VIKAS_MIN_SCORE:    60
          DIKSHA_MIN_SCORE:   50
        run: python -m app.scan_runner

      - name: Commit and push updated job data
        run: |
          git config user.name  "JobHuntAI Bot"
          git config user.email "jobhunt-ai@noreply.github.com"
          git add docs/
          git diff --staged --quiet || (
            git commit -m "scan $(date +'%Y-%m-%d %H:%M UTC') — jobs updated" &&
            git push origin claude/compare-cursor-repos-E1qVk
          )
