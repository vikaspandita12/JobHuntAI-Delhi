<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e3a5f">
  <title>JobHuntAI Delhi</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;min-height:100vh;padding-bottom:84px;color:#1e293b}

    .hdr{background:#1e3a5f;color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:20}
    .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .hdr h1{font-size:18px;font-weight:700}
    .hdr-sub{font-size:11px;opacity:.7;margin-top:2px}
    .refresh-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:7px 12px;border-radius:20px;font-size:12px}

    .tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0}
    .tab{flex:1;padding:11px 6px;font-size:14px;font-weight:600;border:none;background:none;color:#64748b;position:relative}
    .tab.on{color:#1e3a5f}
    .tab.on::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:#1e3a5f}
    .cnt{display:inline-block;background:#e2e8f0;color:#475569;font-size:11px;padding:1px 7px;border-radius:99px;margin-left:3px}
    .tab.on .cnt{background:#dbeafe;color:#1e40af}

    .stats{display:flex;background:#fff;border-bottom:1px solid #f1f5f9}
    .st{flex:1;text-align:center;padding:7px 2px;border-right:1px solid #f1f5f9}
    .st:last-child{border:none}
    .sv{font-size:18px;font-weight:700;color:#1e3a5f}
    .sl{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px}

    .filters{display:flex;gap:7px;padding:9px 12px;background:#fff;border-bottom:1px solid #e2e8f0;overflow-x:auto}
    .fc{padding:6px 13px;border-radius:99px;border:1.5px solid #e2e8f0;font-size:13px;font-weight:500;white-space:nowrap;background:#fff;color:#475569}
    .fc.on{background:#1e3a5f;color:#fff;border-color:#1e3a5f}

    .list{padding:10px 10px 6px}
    .card{background:#fff;border-radius:12px;margin-bottom:10px;border:1px solid #e2e8f0;overflow:hidden}
    .card.skipped,.card.rejected{opacity:.45}
    .card-body{padding:13px 13px 0}
    .row1{display:flex;gap:11px;align-items:flex-start}
    .score-wrap{text-align:center;min-width:48px}
    .score{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
    .slbl{font-size:9px;color:#64748b;margin-top:3px;line-height:1.1}
    .info{flex:1;min-width:0}
    .title{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
    .company{font-size:13px;color:#374151;font-weight:500;margin-top:2px}
    .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
    .chip{font-size:11px;padding:2px 8px;border-radius:6px;background:#f8fafc;color:#6b7280}
    .ch-src{background:#eff6ff;color:#1d4ed8}
    .ch-sal{background:#f0fdf4;color:#166534}
    .ch-new{background:#fef9c3;color:#854d0e;font-weight:600}
    .ch-stage{background:#ede9fe;color:#5b21b6;font-weight:600}

    details.why{margin:9px 0 0;font-size:12.5px;line-height:1.45}
    details.why summary{color:#475569;font-weight:600;list-style:none;cursor:pointer;padding:4px 0}
    details.why summary::-webkit-details-marker{display:none}
    .ok{color:#166534;margin-top:3px}
    .flag{color:#b45309;margin-top:3px}

    .actions{display:flex;border-top:1px solid #f1f5f9;margin-top:11px}
    .ab{flex:1;padding:12px 4px;border:none;font-size:13px;font-weight:600;background:#fff;color:#374151;border-right:1px solid #f1f5f9;text-align:center;text-decoration:none;display:block}
    .ab:last-child{border-right:none}
    .ab.apply{background:#1e3a5f;color:#fff;flex:1.4}
    .ab.claude{background:#fdf4ec;color:#9a3412}
    .ab.mail{background:#f0f9ff;color:#0369a1}
    select.ab{appearance:none;-webkit-appearance:none;background:#f8fafc;color:#334155}

    .empty,.loading{text-align:center;padding:50px 20px;color:#94a3b8;font-size:13px}
    .empty h3{font-size:17px;color:#94a3b8;margin-bottom:6px}

    .health{margin:4px 10px 12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;font-size:12.5px}
    .health summary{padding:11px 13px;font-weight:600;color:#475569;list-style:none}
    .health table{width:100%;border-collapse:collapse}
    .health td{padding:6px 13px;border-top:1px solid #f1f5f9}
    .health td.n{text-align:right;color:#475569;font-variant-numeric:tabular-nums}
    .health .bad{color:#b91c1c}

    .btmbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:9px 12px 18px;display:flex;gap:9px;z-index:20}
    .bscan{flex:1;padding:12px;background:#1e3a5f;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700}

    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
    .toast.show{opacity:1}
  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div>
      <h1>JobHuntAI Delhi</h1>
      <div class="hdr-sub" id="scanInfo">Loading…</div>
    </div>
    <button class="refresh-btn" onclick="reload()">&#8635; Refresh</button>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="switchTab('vikas',this)">Vikas <span class="cnt" id="cv">0</span></button>
  <button class="tab"    onclick="switchTab('diksha',this)">Diksha <span class="cnt" id="cd">0</span></button>
</div>

<div class="stats">
  <div class="st"><div class="sv" id="s1">-</div><div class="sl">Jobs</div></div>
  <div class="st"><div class="sv" id="s2" style="color:#f59e0b">-</div><div class="sl">New today</div></div>
  <div class="st"><div class="sv" id="s3" style="color:#22c55e">-</div><div class="sl">Applied</div></div>
  <div class="st"><div class="sv" id="s4" style="color:#8b5cf6">-</div><div class="sl">Interviews</div></div>
</div>

<div class="filters" id="filters"></div>

<div class="list" id="list"><div class="loading">Loading jobs…</div></div>

<details class="health" id="health" hidden>
  <summary>Sources in the last scan ▾</summary>
  <table id="healthTable"></table>
</details>

<div class="btmbar">
  <button class="bscan" onclick="goActions()">&#9654; Run a scan on GitHub</button>
</div>

<div class="toast" id="toast"></div>

<script>
// Application stages, as on Dossier's board: draft → applied → interview → offer
const STAGES = [
  ['new','New'], ['applied','Applied'], ['interview','Interview'],
  ['offer','Offer'], ['rejected','Rejected'], ['skipped','Skipped'],
];
const FILTERS = [['active','Open'], ['strong','Good fit+'], ...STAGES];
let tab='vikas', filter='active';
let data={vikas:[],diksha:[]}, profiles={}, stats={};

const stageOf = id => { try { return localStorage.getItem('jh_'+id) || 'new'; } catch { return 'new'; } };
const setStage = (id,s) => { try { localStorage.setItem('jh_'+id, s); } catch {} };
const color = s => s>=85?'#16a34a':s>=70?'#22c55e':s>=50?'#f59e0b':'#94a3b8';
const today = () => new Date().toISOString().slice(0,10);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '#';

async function reload(){
  const ts='?t='+Date.now();
  const get = (f, d) => fetch(f+ts).then(r=>r.ok?r.json():d).catch(()=>d);
  const [v,d,s,p] = await Promise.all([get('jobs_vikas.json',[]), get('jobs_diksha.json',[]), get('stats.json',{}), get('profiles.json',{})]);
  data.vikas=v||[]; data.diksha=d||[]; stats=s||{}; profiles=p||{};
  document.getElementById('cv').textContent=data.vikas.length;
  document.getElementById('cd').textContent=data.diksha.length;
  document.getElementById('scanInfo').textContent = stats.last_scan ? 'Last scan: '+stats.last_scan : 'No scan yet';
  renderFilters(); render(); renderHealth();
}

function renderFilters(){
  document.getElementById('filters').innerHTML = FILTERS.map(([k,l]) =>
    `<button class="fc ${k===filter?'on':''}" onclick="setFilter('${k}')">${l}</button>`).join('');
}

function render(){
  const jobs=data[tab], key=tab+'_score', fitKey=tab+'_fit', td=today();
  document.getElementById('s1').textContent=jobs.length;
  document.getElementById('s2').textContent=jobs.filter(j=>j.scanned_date===td).length;
  document.getElementById('s3').textContent=jobs.filter(j=>['applied','interview','offer'].includes(stageOf(j.job_id))).length;
  document.getElementById('s4').textContent=jobs.filter(j=>stageOf(j.job_id)==='interview').length;

  const list = jobs.filter(j => {
    const st=stageOf(j.job_id);
    if (filter==='active') return !['skipped','rejected'].includes(st);
    if (filter==='strong') return (j[key]||0)>=70 && !['skipped','rejected'].includes(st);
    return st===filter;
  });
  const el=document.getElementById('list');
  if(!list.length){ el.innerHTML='<div class="empty"><h3>Nothing here</h3>Try another filter, or run a scan.</div>'; return; }

  el.innerHTML = list.map(j => {
    const score=j[key]||0, fit=j[fitKey]||{}, st=stageOf(j.job_id), id=esc(j.job_id);
    const reasons=(fit.reasons||[]).map(r=>`<div class="ok">✓ ${esc(r)}</div>`).join('');
    const flags=(fit.red_flags||[]).map(r=>`<div class="flag">⚠ ${esc(r)}</div>`).join('');
    const stageSel = `<select class="ab" aria-label="Stage" onchange="mark('${id}',this.value)">${
      STAGES.map(([k,l])=>`<option value="${k}" ${k===st?'selected':''}>${l}</option>`).join('')}</select>`;
    const mail = j.apply_email ? `<button class="ab mail" onclick="emailFor('${id}')">✉ Email</button>` : '';
    return `<div class="card ${st}">
      <div class="card-body">
        <div class="row1">
          <div class="score-wrap">
            <div class="score" style="background:${color(score)}">${score}</div>
            <div class="slbl">${esc((fit.band||'').replace(' fit',''))}</div>
          </div>
          <div class="info">
            <div class="title">${esc(j.title)}</div>
            <div class="company">${esc(j.company)}</div>
            <div class="chips">
              ${j.location?`<span class="chip">📍 ${esc(j.location)}</span>`:''}
              <span class="chip ch-src">${esc(j.source)}${j.via?' · '+esc(j.via):''}</span>
              ${j.salary&&j.salary!=='Not disclosed'?`<span class="chip ch-sal">${esc(j.salary)}</span>`:''}
              ${j.scanned_date===td?'<span class="chip ch-new">NEW TODAY</span>':''}
              ${st!=='new'?`<span class="chip ch-stage">${esc(STAGES.find(s=>s[0]===st)?.[1]||st)}</span>`:''}
            </div>
          </div>
        </div>
        ${reasons||flags?`<details class="why"><summary>Why this score ▾</summary>${reasons}${flags}</details>`:''}
      </div>
      <div class="actions">
        <a class="ab apply" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">Apply →</a>
        <button class="ab claude" onclick="tailor('${id}')">✍️ Tailor</button>
        ${mail}
        ${stageSel}
      </div>
    </div>`;
  }).join('');
}

function renderHealth(){
  const s=stats.sources; if(!s) return;
  document.getElementById('health').hidden=false;
  document.getElementById('healthTable').innerHTML = '<tr><td><b>Source</b></td><td class="n"><b>Found</b></td><td class="n"><b>Kept</b></td></tr>' +
    Object.entries(s).map(([n,v])=>`<tr><td class="${v.fetched?'':'bad'}">${esc(n)}${v.error?' ⚠':''}</td><td class="n">${v.fetched}</td><td class="n">${v.matched}</td></tr>`).join('');
}

const findJob = id => data[tab].find(j=>j.job_id===id);

// Dossier's "Write it with Claude": hand the posting + profile to a new claude.ai chat
function tailor(id){
  const j=findJob(id), p=profiles[tab];
  if(!j) return;
  const facts = p ? JSON.stringify(p, null, 1) : '(profile not loaded — paste my CV)';
  const prompt =
`I'm applying for this job. Using ONLY facts from my profile below — never invent experience, employers, numbers or certifications — write:
1. A match summary: which requirements I meet (with the evidence from my profile) and which ones my profile doesn't show (gaps).
2. A tailored resume headline, 4-line professional summary and the 6 most relevant bullet points, reworded for this posting.
3. A cover letter under 300 words, confident and specific, mentioning I'm relocating to Delhi NCR.
4. A short email to send with the application${j.apply_email?' to '+j.apply_email:''}.

JOB: ${j.title} — ${j.company} (${j.location})
Link: ${j.url}
Posting:
${(j.description||'(only the title is available — open the link)').slice(0,1500)}

MY PROFILE:
${facts}`;
  window.open('https://claude.ai/new?q='+encodeURIComponent(prompt), '_blank', 'noopener');
}

function emailFor(id){
  const j=findJob(id), p=profiles[tab]||{};
  const subject=`Application: ${j.title}`;
  const body=`Hello,\n\nI'd like to apply for the ${j.title} role at ${j.company}. I'm ${p.current_role||''} at ${p.current_company||''} with ${p.years_experience||''}+ years of experience, relocating to Delhi NCR.\n\nMy resume is attached. I'd welcome a conversation.\n\nBest regards,\n${p.name||''}`;
  location.href=`mailto:${encodeURIComponent(j.apply_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function mark(id,s){ setStage(id,s); render(); toast('Moved to '+(STAGES.find(x=>x[0]===s)||[,s])[1]); }
function switchTab(t,el){ tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); el.classList.add('on'); render(); }
function setFilter(f){ filter=f; renderFilters(); render(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function goActions(){ window.open('https://github.com/vikaspandita12/JobHuntAI-Delhi/actions/workflows/daily_scan.yml','_blank','noopener'); }

reload();
setInterval(reload, 5*60*1000);
</script>
</body>
</html>
